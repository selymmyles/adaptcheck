name = "janus"
main = "worker/index.ts"
compatibility_date = "2025-06-01"

# Serve the Vite production build (dist/) as static assets.
# Requests that don't match a static file (e.g. POST /api/analyze)
# fall through to the worker above.
[assets]
directory = "./dist"

# Token-usage ledger for spend monitoring (daily keys: usage:YYYY-MM-DD).
[[kv_namespaces]]
binding = "janus_usage"
id = "aa23cdea1ac041a6b86930609ed99a83"
